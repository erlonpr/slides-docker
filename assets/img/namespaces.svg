<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo -->
  <rect width="800" height="420" rx="10" fill="#f8f9fa"/>
  
  <!-- Estilos de Texto -->
  <style>
    .header { font: bold 16px sans-serif; fill: #ffffff; }
    .cell-text { font: 14px sans-serif; fill: #333333; }
    .bold-text { font: bold 14px sans-serif; fill: #000000; }
    .row-bg-even { fill: #ffffff; }
    .row-bg-odd { fill: #f1f3f5; }
  </style>

  <!-- Cabeçalho - ATUALIZADO PARA AZUL DOCKER (#2496ED) -->
  <rect x="20" y="20" width="760" height="40" rx="5" fill="#2496ED"/>
  <text x="80" y="45" text-anchor="middle" class="header">Namespace</text>
  <text x="240" y="45" text-anchor="middle" class="header">Componente</text>
  <text x="530" y="45" text-anchor="middle" class="header">Função</text>

  <!-- Linha 1: PID -->
  <rect x="20" y="65" width="760" height="50" class="row-bg-even"/>
  <text x="80" y="95" text-anchor="middle" class="bold-text">PID</text>
  <text x="240" y="95" text-anchor="middle" class="cell-text">Processos</text>
  <text x="360" y="95" class="cell-text">Contêiner não vê processos do host ou de outros contêineres</text>

  <!-- Linha 2: NET -->
  <rect x="20" y="115" width="760" height="50" class="row-bg-odd"/>
  <text x="80" y="145" text-anchor="middle" class="bold-text">NET</text>
  <text x="240" y="145" text-anchor="middle" class="cell-text">Rede</text>
  <text x="360" y="145" class="cell-text">Provê interfaces, portas IP e tabelas de roteamento próprias</text>

  <!-- Linha 3: MNT -->
  <rect x="20" y="165" width="760" height="50" class="row-bg-even"/>
  <text x="80" y="195" text-anchor="middle" class="bold-text">MNT</text>
  <text x="240" y="195" text-anchor="middle" class="cell-text">Sistema de arquivos</text>
  <text x="360" y="195" class="cell-text">Contêiner tem sua própria visão da árvore de diretórios</text>

  <!-- Linha 4: IPC -->
  <rect x="20" y="215" width="760" height="50" class="row-bg-odd"/>
  <text x="80" y="245" text-anchor="middle" class="bold-text">IPC</text>
  <text x="240" y="245" text-anchor="middle" class="cell-text">Comunicação</text>
  <text x="360" y="245" class="cell-text">Isola memória compartilhada e filas de mensagens entre processos</text>

  <!-- Linha 5: UTS -->
  <rect x="20" y="265" width="760" height="50" class="row-bg-even"/>
  <text x="80" y="295" text-anchor="middle" class="bold-text">UTS</text>
  <text x="240" y="295" text-anchor="middle" class="cell-text">Hostname</text>
  <text x="360" y="295" class="cell-text">Isola o nome da máquina e nomes de domínio</text>

  <!-- Linha 6: USER -->
  <rect x="20" y="315" width="760" height="50" class="row-bg-odd"/>
  <text x="80" y="345" text-anchor="middle" class="bold-text">USER</text>
  <text x="240" y="345" text-anchor="middle" class="cell-text">Usuários</text>
  <text x="360" y="345" class="cell-text">Permite ser root no contêiner sem ter privilégios de root no host</text>
  
  <!-- Linhas Divisórias -->
  <line x1="20" y1="65" x2="780" y2="65" stroke="#dee2e6" />
  <line x1="140" y1="20" x2="140" y2="365" stroke="#dee2e6" />
  <line x1="340" y1="20" x2="340" y2="365" stroke="#dee2e6" />
</svg>
